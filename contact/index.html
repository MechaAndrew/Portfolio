<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mecha Andrew | BARGUZIN</title>
  <link rel="icon" type="image/x-icon" href="assets/Mecha Andrew Logo Site.png">
  <link href="../StyleSheet.css" rel="stylesheet" type="text/css">
</head>
<script>



  // Wait for DOM to be ready
  document.addEventListener("DOMContentLoaded", function () {
    // Fetch Sidebar and then setup event listeners
    fetch('../sidebar/fragment.html')
      .then(res => res.text())
      .then(html => {
        html = html.replace(/(src|href)="assets\//g, '$1="../assets/');
        document.getElementById('Sidebar').innerHTML = html;
        setupSidebar(); // <-- Call this after sidebar is loaded
      });

    // Fetch TopBar (use correct case!)
    fetch('../topbar/index.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('Topbar').innerHTML = html;
      });
  });

</script>

<body>


  <!-- SIDEBAR -->
  <div id="Sidebar" class="sidebar"></div>
  <div class="content">
    <div id="Topbar"></div>
    <div id="scroll-notify" class="scroll-notify" aria-live="polite"></div>
    <div class="graph-area">
      <!-- Graph-Area + Canvas controls the diagonal lines and the rest of the nodes-->
      <canvas id="canvas"></canvas>

      <!-- --------------------------------------------------------------------------------------------------------- -->
      
      
      <!-- Start Node Group (Welcome) -->
      <div class="node-group" id="home-section">
        <!-- <video class="node-video-background" loop muted src="assets/PersistancePortfolioClip.mp4"></video> -->

        <!--Start Node Home/Welcome-->
        <div class="node" id="node-jump1" style="width: 80pc;">

          <div class="node-header" style="background-color: #ff3535">
            <p>Andrew Dresel-Kurtz | Contact</p>
            <div class="node-visible"><img src="assets/Node-Visible-Open.png" alt="Toggle visibility" draggable="false">
            </div>
          </div>
          <!-- Start Node Body (The gray are that stores all the info) -->
          <div class="node-body">
            <!-- Node Contents - Info -->
            <div class="node-contents" href="#">

              <div class="node-info">

                <!--Node Topics-->
                <div class="node-topics">
                  <div class="node-topic-keyword topic-info">Info</div>
                </div> <!--End Node Topics-->
                <p>Please reach out via LinkedIn or Email!
                  You can also check out my other socials on the left side of the page!
                </p>

              </div> <!--End Node Info-->

            </div><!--End Node Contents-->

            <!-- Node Contents - Image -->
            <div class="node-contents" href="#" style="border: 2px solid #ccc; border-radius: 8px;">

              <!--Start Node Info (This info is a vertical section to list details)-->
              <div class="node-info">

                <a href="https://www.linkedin.com/in/andrew-dresel-kurtz/" target="_blank" class="video-container" style=" display: block;">
                  <div class="node-info-details">Click to open</div>
                  <img class="node-video" muted loop playsinline src="../assets/Icon LinkedIn.png"></img>
                </a>
                <a href="mailto:mechandrewdk@gmail.com" target="_blank" class="video-container" style=" display: block;">
                  <div class="node-info-details">Click to open</div>
                  <img class="node-video" muted loop playsinline src="../assets/Icon Resume.png"></img>
                </a>

              </div> <!--End Node Info-->
            </div><!--End Node Contents-->

        



          </div> <!--End Node Body-->
        </div> <!--  End Node -->
      </div> <!--End Node group-->
      <!-- --------------------------------------------------------------------------------------------------------- -->


      


</body>

</html>

<script type="text/javascript" src="../Script.js"></script>
