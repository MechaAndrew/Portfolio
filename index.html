<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

</head>
	<script>
	function setupSidebar() {
  var coll = document.getElementsByClassName("collapsible");
  for (var i = 0; i < coll.length; i++) {
    coll[i].addEventListener("click", function() {
      this.classList.toggle("active");
      var content = this.nextElementSibling;
      if (content.style.maxHeight){
        content.style.maxHeight = null;
        this.innerHTML = this.innerHTML.replace("▼", "&#11208;");
      } else {
        content.style.maxHeight = content.scrollHeight + "px";
        this.innerHTML = this.innerHTML.replace("&#11208;", "▼");
      }
    });
  }
}

// Wait for DOM to be ready
document.addEventListener("DOMContentLoaded", function() {
  // Fetch Sidebar and then setup event listeners
  fetch('sidebar/index.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('Sidebar').innerHTML = html;
      setupSidebar();
    });

  // Fetch TopBar (use correct case!)
  fetch('topbar/index.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('Topbar').innerHTML = html;
    });
});
	
</script>

<body>
		<div id="Sidebar"></div>
	<div class="content">
		<!-- <div id="Topbar"></div> -->
  
  <!-- Move canvas inside graph-area and remove the old canvas above -->
  <div class="graph-area" style="position: relative;">
    <canvas id="canvas" ></canvas>
    
  </div>
  <!--End Graph--> 
</div>
<!--End Content-->

</body>
